name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.25.0'
          run_install: false
      - name: Install and build
        shell: pwsh
        run: ./Setup-Surge.ps1
      - name: Python and evaluation checks
        shell: pwsh
        run: ./.venv/Scripts/python.exe -B scripts/test.py
      - name: Replay sanitized native demo
        run: ./.venv/Scripts/python.exe -B scripts/verify_native_demo.py
      - name: Owned native fixture and baseline checks
        shell: pwsh
        run: |
          cmake -S native -B native/build -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build native/build --config Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir native/build -C Release --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe -B scripts/test_native_live.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe -B -m unittest test_native_session test_native_window -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe -B scripts/test_native_stream.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Desktop boundary and runtime checks
        working-directory: desktop
        run: pnpm test
      - name: Native build compatibility
        shell: pwsh
        run: ./.venv/Scripts/python.exe -B scripts/test_native_compatibility.py --output verification/native-compatibility.json
      - name: Reproduce published evaluation evidence
        shell: pwsh
        run: |
          $archive = 'evidence/surge-evaluation-evidence.zip'
          $expected = '936a7a7708d896c8c764a5d9dc60027d81bf3f6cfb936578f4bb12a267d3ec5d'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Evaluation archive fingerprint differs.'
          }
          $evidenceFolder = Join-Path $env:RUNNER_TEMP 'surge-evidence'
          Expand-Archive -LiteralPath $archive -DestinationPath $evidenceFolder
          ./.venv/Scripts/python.exe -B scripts/verify_evidence.py $evidenceFolder
      - name: JavaScript formatting
        working-directory: desktop
        run: pnpm run format:check
      - name: Investigation and evaluation journeys
        working-directory: desktop
        run: pnpm run test:ui
      - name: Display scaling and keyboard access
        working-directory: desktop
        run: pnpm run test:accessibility
      - name: Native evidence desktop journey
        working-directory: desktop
        run: node native.test.cjs
      - name: Continuous collection desktop journey
        working-directory: desktop
        run: pnpm run test:stream
      - name: Published demo desktop journey
        working-directory: desktop
        run: node demo.test.cjs
      - name: Release hygiene
        run: ./.venv/Scripts/python.exe -B scripts/check_release.py
